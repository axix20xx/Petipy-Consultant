
name: Build iOS Unsigned

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Petipy IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo configuration
        working-directory: artifacts/petipy-consultant
        run: |
          pnpm exec expo config --type public
          pnpm exec expo-doctor || true

      - name: Generate iOS project
        working-directory: artifacts/petipy-consultant
        env:
          EXPO_PUBLIC_IOS_VOIP_ENABLED: 'false'
        run: |
          pnpm exec expo prebuild --platform ios --no-install

      - name: Verify dynamic Firebase pod linkage
        working-directory: artifacts/petipy-consultant
        shell: bash
        run: |
          if [ ! -f ios/Podfile ] || [ ! -f ios/Podfile.properties.json ]; then
            echo "Expo prebuild did not generate the iOS Podfile and its properties file"
            exit 1
          fi

          # SDK 58's Podfile template reads linkage from Podfile.properties.json.
          node <<'NODE'
          const fs = require("node:fs");
          const podfile = fs.readFileSync("ios/Podfile", "utf8");
          const properties = JSON.parse(
            fs.readFileSync("ios/Podfile.properties.json", "utf8"),
          );

          if (properties["ios.useFrameworks"] !== "dynamic") {
            throw new Error(
              "Expected ios.useFrameworks=dynamic in Podfile.properties.json",
            );
          }

          const linkageHook =
            "use_frameworks! :linkage => podfile_properties['ios.useFrameworks'].to_sym";
          if (!podfile.includes(linkageHook)) {
            throw new Error(
              "Generated Podfile does not apply Expo's ios.useFrameworks property",
            );
          }

          if (/use_frameworks!\s*:linkage\s*=>\s*:static/.test(podfile)) {
            throw new Error(
              "Generated Podfile contains an explicit static framework linkage",
            );
          }

          if (
            process.env.USE_FRAMEWORKS &&
            process.env.USE_FRAMEWORKS !== "dynamic"
          ) {
            throw new Error(
              "USE_FRAMEWORKS overrides the Expo dynamic framework setting",
            );
          }

          console.log(
            "Generated Podfile is configured for dynamic framework linkage.",
          );
          NODE

      - name: Install CocoaPods
        working-directory: artifacts/petipy-consultant/ios
        run: |
          pod install

      - name: Discover Xcode workspace and scheme
        id: xcode
        working-directory: artifacts/petipy-consultant
        shell: bash
        run: |
          set -o pipefail

          WORKSPACE="ios/PetipyConsultant.xcworkspace"
          PROJECT="ios/PetipyConsultant.xcodeproj"
          APP_SCHEME="PetipyConsultant"
          APP_TARGET="PetipyConsultant"

          if [ ! -d "$WORKSPACE" ]; then
            echo "Expected Expo CocoaPods workspace was not generated: $WORKSPACE"
            find ios -maxdepth 2 -print | sort || true
            exit 1
          fi

          if [ ! -d "$PROJECT" ]; then
            echo "Expected Expo Xcode project was not generated: $PROJECT"
            find ios -maxdepth 2 -print | sort || true
            exit 1
          fi

          EXPECTED_BUNDLE_ID="$(
            pnpm exec expo config --json --type prebuild |
              node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => (input += chunk));
                process.stdin.on("end", () => {
                  const config = JSON.parse(input);
                  const bundleId = config.ios?.bundleIdentifier;
                  if (!bundleId) {
                    console.error("Resolved Expo config has no iOS bundle identifier");
                    process.exitCode = 1;
                    return;
                  }
                  process.stdout.write(bundleId);
                });
              '
          )"
          if [ "$EXPECTED_BUNDLE_ID" != "com.petipy.consultant" ]; then
            echo "Unexpected Expo bundle identifier: $EXPECTED_BUNDLE_ID"
            echo "Expected: com.petipy.consultant"
            exit 1
          fi

          SCHEME_LIST_JSON="$RUNNER_TEMP/Petipy-xcode-schemes.json"
          if ! xcodebuild -list -json -workspace "$WORKSPACE" > "$SCHEME_LIST_JSON"; then
            echo "xcodebuild could not list schemes in $WORKSPACE"
            cat "$SCHEME_LIST_JSON" || true
            exit 1
          fi

          AVAILABLE_SCHEMES="$(
            node -e '
              const fs = require("node:fs");
              const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              for (const scheme of result.workspace?.schemes ?? []) {
                console.log(scheme);
              }
            ' "$SCHEME_LIST_JSON"
          )"
          echo "Generated workspace: $WORKSPACE"
          echo "Generated project: $PROJECT"
          echo "Available workspace schemes:"
          printf '%s\n' "$AVAILABLE_SCHEMES" | sed 's/^/  /'

          if ! printf '%s\n' "$AVAILABLE_SCHEMES" | grep -Fxq "$APP_SCHEME"; then
            echo "Required application scheme '$APP_SCHEME' is missing."
            echo "The app target must be built; dependency schemes such as 'boost' are not valid substitutes."
            exit 1
          fi

          SETTINGS_FILE="$RUNNER_TEMP/PetipyConsultant-build-settings.txt"
          if ! xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings > "$SETTINGS_FILE" 2>&1; then
            echo "Could not inspect build settings for app scheme '$APP_SCHEME'."
            tail -n 100 "$SETTINGS_FILE" || true
            exit 1
          fi

          node - "$SETTINGS_FILE" "$APP_TARGET" "$EXPECTED_BUNDLE_ID" <<'NODE'
          const fs = require("node:fs");
          const text = fs.readFileSync(process.argv[2], "utf8");
          const expectedTarget = process.argv[3];
          const expectedBundleId = process.argv[4];
          const headers = [...text.matchAll(/^Build settings for action .+ and target (.+):\s*$/gm)];
          const targets = headers.map((header) => header[1]);
          const appHeader = headers.find((header) => header[1] === expectedTarget);

          if (!appHeader) {
            throw new Error(
              `App target '${expectedTarget}' is not in the scheme build settings. Targets: ${targets.join(", ")}`,
            );
          }

          const start = appHeader.index + appHeader[0].length;
          const nextHeader = headers.find((header) => header.index > appHeader.index);
          const section = text.slice(start, nextHeader?.index ?? text.length);
          const settings = Object.fromEntries(
            [...section.matchAll(/^\s*([A-Z0-9_]+)\s*=\s*(.*?)\s*$/gm)].map(
              (match) => [match[1], match[2]],
            ),
          );
          const bundleId = settings.PRODUCT_BUNDLE_IDENTIFIER;
          const productType = settings.PRODUCT_TYPE;

          if (bundleId !== expectedBundleId) {
            throw new Error(
              `App target bundle ID mismatch: expected ${expectedBundleId}, found ${bundleId ?? "<missing>"}`,
            );
          }
          if (productType !== "com.apple.product-type.application") {
            throw new Error(
              `Target ${expectedTarget} is not an iOS application (PRODUCT_TYPE=${productType ?? "<missing>"})`,
            );
          }

          console.log(`Verified app target: ${expectedTarget}`);
          console.log(`Verified app scheme: ${expectedTarget}`);
          console.log(`Verified application bundle ID: ${bundleId}`);
          console.log(`Verified application product type: ${productType}`);
          NODE

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "scheme=$APP_SCHEME" >> "$GITHUB_OUTPUT"
          echo "target=$APP_TARGET" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$EXPECTED_BUNDLE_ID" >> "$GITHUB_OUTPUT"

      - name: Build iOS application
        working-directory: artifacts/petipy-consultant
        shell: bash
        env:
          # This workflow produces an internal, unsigned development-auth build.
          # The server still validates the OTP; no code is hardcoded in the app.
          EXPO_PUBLIC_PETIPY_AUTH_MODE: development
          EXPO_PUBLIC_IOS_VOIP_ENABLED: 'false'
        run: |
          set -o pipefail
          BUILD_LOG="$RUNNER_TEMP/Petipy-xcodebuild.log"
          PRODUCTS_ROOT="$RUNNER_TEMP/PetipyBuild/Build/Products"

          echo "Building application target '${{ steps.xcode.outputs.target }}' with scheme '${{ steps.xcode.outputs.scheme }}'"
          echo "Workspace: ${{ steps.xcode.outputs.workspace }}"
          echo "Expected bundle identifier: ${{ steps.xcode.outputs.bundle_id }}"

          if ! xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PetipyBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$BUILD_LOG"; then
            echo "The Petipy Consultant application target failed to build."
            echo "Relevant Xcode diagnostics:"
            grep -E '(^| )error:|warning:|BUILD FAILED|CompileAssetCatalog|SwiftCompile|CompileC' "$BUILD_LOG" | tail -n 100 || true
            echo "Build products available for diagnosis:"
            if [ -d "$PRODUCTS_ROOT" ]; then
              PRODUCTS_INVENTORY="$RUNNER_TEMP/Petipy-products.txt"
              find "$PRODUCTS_ROOT" -maxdepth 5 -print | sort > "$PRODUCTS_INVENTORY"
              sed -n '1,300p' "$PRODUCTS_INVENTORY"
            else
              echo "Xcode did not create the products directory: $PRODUCTS_ROOT"
            fi
            exit 1
          fi

          if [ ! -d "$PRODUCTS_ROOT" ]; then
            echo "xcodebuild succeeded but created no products directory: $PRODUCTS_ROOT"
            exit 1
          fi
          echo "Xcode application build completed. Products:"
          PRODUCTS_INVENTORY="$RUNNER_TEMP/Petipy-products.txt"
          find "$PRODUCTS_ROOT" -maxdepth 5 -print | sort > "$PRODUCTS_INVENTORY"
          sed -n '1,300p' "$PRODUCTS_INVENTORY"

      - name: Package unsigned IPA
        shell: bash
        run: |
          PRODUCTS_ROOT="$RUNNER_TEMP/PetipyBuild/Build/Products"
          RELEASE_DIR="$PRODUCTS_ROOT/Release-iphoneos"
          EXPECTED_BUNDLE_ID="$(
            pnpm --filter @workspace/petipy-consultant exec expo config --json --type prebuild |
              node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => (input += chunk));
                process.stdin.on("end", () => {
                  const config = JSON.parse(input);
                  const bundleId = config.ios?.bundleIdentifier;
                  if (!bundleId) {
                    console.error("Resolved Expo config has no iOS bundle identifier");
                    process.exitCode = 1;
                    return;
                  }
                  process.stdout.write(bundleId);
                });
              '
          )"

          echo "Expected bundle identifier from Expo config: $EXPECTED_BUNDLE_ID"
          echo "Release-iphoneos directory contents:"
          if [ -d "$RELEASE_DIR" ]; then
            find "$RELEASE_DIR" -maxdepth 4 -print | sort
          else
            echo "Missing directory: $RELEASE_DIR"
          fi

          if [ ! -d "$PRODUCTS_ROOT" ]; then
            echo "Xcode products directory does not exist: $PRODUCTS_ROOT"
            exit 1
          fi

          ALL_APP_BUNDLES=()
          MATCHING_APP_BUNDLES=()
          echo "Scanning compiled application bundles under $PRODUCTS_ROOT:"
          while IFS= read -r -d '' APP; do
            case "$APP" in
              *.appex|*.appex/*)
                echo "Skipping extension: $APP"
                continue
                ;;
            esac

            ALL_APP_BUNDLES+=("$APP")
            INFO_PLIST="$APP/Info.plist"
            if [ ! -f "$INFO_PLIST" ]; then
              echo "Candidate has no Info.plist: $APP"
              continue
            fi

            BUNDLE_ID=$(/usr/libexec/PlistBuddy \
              -c 'Print CFBundleIdentifier' \
              "$INFO_PLIST" 2>/dev/null || true)
            APP_NAME=$(/usr/libexec/PlistBuddy \
              -c 'Print CFBundleDisplayName' \
              "$INFO_PLIST" 2>/dev/null || true)
            if [ -z "$APP_NAME" ]; then
              APP_NAME=$(/usr/libexec/PlistBuddy \
                -c 'Print CFBundleName' \
                "$INFO_PLIST" 2>/dev/null || true)
            fi

            echo "Discovered app: path=$APP | name=${APP_NAME:-<unnamed>} | bundleId=${BUNDLE_ID:-<unreadable>}"
            if [ "$BUNDLE_ID" = "$EXPECTED_BUNDLE_ID" ]; then
              MATCHING_APP_BUNDLES+=("$APP")
            fi
          done < <(find "$PRODUCTS_ROOT" -type d -name '*.app' -print0)

          if [ "${#MATCHING_APP_BUNDLES[@]}" -ne 1 ]; then
            echo "Expected exactly one app with bundle identifier $EXPECTED_BUNDLE_ID; found ${#MATCHING_APP_BUNDLES[@]}."
            echo "All discovered .app bundles:"
            if [ "${#ALL_APP_BUNDLES[@]}" -eq 0 ]; then
              echo "No .app bundles were found under $PRODUCTS_ROOT"
            else
              printf '  %s\n' "${ALL_APP_BUNDLES[@]}"
            fi
            exit 1
          fi

          MATCHED_APP="${MATCHING_APP_BUNDLES[0]}"
          echo "Selected application path: $MATCHED_APP"
          echo "Selected bundle identifier: $EXPECTED_BUNDLE_ID"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$MATCHED_APP" Payload/Petipy.app

          ditto -c -k --sequesterRsrc --keepParent \
            Payload Petipy-unsigned.ipa

          unzip -t Petipy-unsigned.ipa

          VALIDATION_DIR="$(mktemp -d "$RUNNER_TEMP/PetipyIPAValidation.XXXXXX")"
          trap 'rm -rf "$VALIDATION_DIR"' EXIT
          unzip -q Petipy-unsigned.ipa -d "$VALIDATION_DIR"

          PACKAGED_APP="$VALIDATION_DIR/Payload/Petipy.app"
          if [ ! -d "$PACKAGED_APP" ]; then
            echo "IPA does not contain Payload/Petipy.app"
            exit 1
          fi
          if [ ! -f "$PACKAGED_APP/Info.plist" ]; then
            echo "Packaged Petipy.app is missing Info.plist"
            exit 1
          fi

          PACKAGED_BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c 'Print CFBundleIdentifier' \
            "$PACKAGED_APP/Info.plist")
          if [ "$PACKAGED_BUNDLE_ID" != "$EXPECTED_BUNDLE_ID" ]; then
            echo "IPA bundle identifier mismatch: expected $EXPECTED_BUNDLE_ID, found $PACKAGED_BUNDLE_ID"
            exit 1
          fi

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c 'Print CFBundleExecutable' \
            "$PACKAGED_APP/Info.plist")
          if [ -z "$EXECUTABLE" ] || [ ! -f "$PACKAGED_APP/$EXECUTABLE" ]; then
            echo "Packaged app executable is missing: ${EXECUTABLE:-<empty>}"
            exit 1
          fi

          echo "Validated IPA app: Payload/Petipy.app ($PACKAGED_BUNDLE_ID)"
          echo "Validated executable: $EXECUTABLE"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Petipy-iOS-Unsigned
          path: Petipy-unsigned.ipa
          retention-days: 7
