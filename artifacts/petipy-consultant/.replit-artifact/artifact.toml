kind = "mobile"
previewPath = "/"
title = "Petipy Consultant"
description = "An Android calling app for Petipy voice consultants, with Persian RTL availability, incoming calls, in-call controls, and call history."
version = "1.0.0"
id = "artifacts/petipy-consultant"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23622

[services.development]
run = "pnpm --filter @workspace/petipy-consultant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/petipy-consultant", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/petipy-consultant", "run", "serve" ]

[services.env]
PORT = "23622"
BASE_PATH = "/"
